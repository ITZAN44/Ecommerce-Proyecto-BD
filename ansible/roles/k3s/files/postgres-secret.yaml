# Secret para credenciales de PostgreSQL
# NOTA: En producción real usa Sealed Secrets o Vault
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: ecommerce_user
  POSTGRES_PASSWORD: ecommerce_secure_2024
  POSTGRES_DB: ecommerce_db
