---
# ============================================
# ROLE: docker
# ============================================
# Propósito: Instalar y configurar Docker Engine + Docker Compose
# Compatible con: Ubuntu 20.04, 22.04, 24.04
# ============================================

# 1. Actualizar repositorios del sistema
- name: "Actualizar cache de apt"
  apt:
    update_cache: yes
    cache_valid_time: 3600  # No actualizar si se hizo hace menos de 1 hora
  become: yes

# 2. Instalar paquetes prerequisitos
- name: "Instalar paquetes prerequisitos para Docker"
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  become: yes

# 3. Crear directorio para claves GPG
- name: "Crear directorio para claves GPG"
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

# 4. Agregar clave GPG de Docker
- name: "Agregar clave GPG oficial de Docker"
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  become: yes

# 5. Agregar repositorio de Docker
- name: "Agregar repositorio de Docker"
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/docker.list
  become: yes
  notify: Update apt cache

# 6. Actualizar cache después de agregar repositorio
- name: "Actualizar cache de apt tras agregar repo Docker"
  apt:
    update_cache: yes
  become: yes

# 7. Instalar Docker Engine
- name: "Instalar Docker Engine y componentes"
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: yes
  notify: Start Docker service

# 8. Asegurar que Docker esté corriendo
- name: "Iniciar y habilitar servicio Docker"
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes

# 9. Agregar usuario al grupo docker (ejecutar sin sudo)
- name: "Agregar usuario {{ ansible_user }} al grupo docker"
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes
  notify: Reboot required message

# 10. Verificar instalación de Docker
- name: "Verificar versión de Docker"
  command: docker --version
  register: docker_version
  changed_when: false

# 11. Mostrar versión instalada
- name: "Mostrar versión de Docker instalada"
  debug:
    msg: "{{ docker_version.stdout }}"

# 12. Verificar Docker Compose
- name: "Verificar versión de Docker Compose"
  command: docker compose version
  register: docker_compose_version
  changed_when: false

# 13. Mostrar versión de Compose
- name: "Mostrar versión de Docker Compose instalada"
  debug:
    msg: "{{ docker_compose_version.stdout }}"

# 14. Probar Docker con contenedor de prueba
- name: "Probar Docker ejecutando contenedor hello-world"
  docker_container:
    name: hello-world-test
    image: hello-world
    state: started
    detach: no
    cleanup: yes
  register: docker_test
  become: yes
  ignore_errors: yes

# 15. Mostrar resultado del test
- name: "Mostrar resultado del test de Docker"
  debug:
    msg: |
      ✅ Docker instalado y funcionando correctamente
      Versión: {{ docker_version.stdout }}
      Compose: {{ docker_compose_version.stdout }}
  when: docker_test is succeeded
