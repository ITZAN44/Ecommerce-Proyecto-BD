---
# ============================================
# Variables por defecto para el rol nginx
# ============================================

# Puerto en el que escucha Nginx
nginx_port: 80
nginx_ssl_port: 443

# Configuración del backend (K3s Service ClusterIP)
nginx_backend_host: "10.43.7.181"
nginx_backend_port: 80

# Nombre del servidor
nginx_server_name: "{{ ansible_host }}"

# Configuración de proxy
nginx_proxy_connect_timeout: 60
nginx_proxy_send_timeout: 60
nginx_proxy_read_timeout: 60

# Habilitar logs
nginx_access_log: "/var/log/nginx/ecommerce_access.log"
nginx_error_log: "/var/log/nginx/ecommerce_error.log"

# Cliente max body size (para uploads)
nginx_client_max_body_size: "10M"
