# Ansible Configuration File
# Documentación: https://docs.ansible.com/ansible/latest/reference_appendices/config.html

[defaults]
# Inventario de servidores
inventory = ./inventory/hosts.ini

# Deshabilitar host key checking (útil para desarrollo, NO para producción real)
host_key_checking = False

# Número de conexiones paralelas
forks = 5

# Directorio de roles personalizados
roles_path = ./roles

# Formato de salida (stdout_callback)
# Opciones: default, yaml, json, minimal
stdout_callback = yaml

# Deshabilitar warnings de deprecación (opcional)
deprecation_warnings = False

# Timeout de conexión SSH (segundos)
timeout = 30

# Archivo de log (opcional, útil para debug)
# log_path = ./ansible.log

[privilege_escalation]
# Configuración para sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Configuración SSH
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
