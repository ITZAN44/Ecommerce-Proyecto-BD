# Ansible Inventory File — PLANTILLA (sin datos reales de infraestructura)
#
# Copia este archivo a `hosts.local.ini` (ignorado por git) y completa
# los datos de tus servidores:
#
#   ansible-playbook -i inventory/hosts.local.ini playbooks/deploy-all.yml
#
# Recorda ejecutar los playbooks desde el directorio `ansible/`
# (ansible.cfg resuelve `roles_path = ./roles` de forma relativa).

# ==============================================
# GRUPO: production
# Servidores de producción
# ==============================================
[production]
# vm-ubuntu ansible_host=<IP_DEL_SERVIDOR> ansible_user=<USUARIO> ansible_port=22

# ==============================================
# GRUPO: development
# Entorno local (para testing sin VM)
# ==============================================
[development]
localhost ansible_connection=local

# ==============================================
# VARIABLES POR GRUPO
# ==============================================

# Variables para TODOS los hosts de production
[production:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Variables para development
[development:vars]
ansible_python_interpreter=/usr/bin/python3
