# Secret para credenciales de PostgreSQL — PLANTILLA (sin valores reales)
#
# Este archivo NO contiene credenciales: se versiona solo como referencia
# de las claves que el Deployment espera.
#
# Para crear el Secret real en el cluster, sin escribirlo en disco ni en git:
#
#   kubectl create secret generic postgres-secret \
#     --namespace ecommerce \
#     --from-literal=POSTGRES_USER='<usuario>' \
#     --from-literal=POSTGRES_PASSWORD='<password>' \
#     --from-literal=POSTGRES_DB='ecommerce_db'
#
# En producción real: Sealed Secrets o Vault.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: REEMPLAZAR
  POSTGRES_PASSWORD: REEMPLAZAR
  POSTGRES_DB: ecommerce_db
