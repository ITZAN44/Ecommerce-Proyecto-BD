# Service para exponer la aplicación internamente
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-app
  namespace: ecommerce
  labels:
    app: ecommerce-app
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 4321
    protocol: TCP
    name: http
  selector:
    app: ecommerce-app
